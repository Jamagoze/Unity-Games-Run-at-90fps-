name: Build Unity FPS Unlock

on:
  push:
    paths: [ "unity_fps.zip", ".github/workflows/build.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf build_src && mkdir build_src
          unzip -q unity_fps.zip -d build_src

      - name: Fetch Dobby and zygisk.hpp
        working-directory: build_src
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git Dobby
          if [ ! -f src/zygisk.hpp ]; then
            curl -fsSL https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp -o src/zygisk.hpp \
            || curl -fsSL https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/main/module/jni/zygisk.hpp -o src/zygisk.hpp
          fi
          test -s src/zygisk.hpp

      - name: Build both ABIs
        working-directory: build_src
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S . -B out/$ABI -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
            cmake --build out/$ABI
          done

      - name: Package module
        working-directory: build_src
        run: |
          rm -rf pkg && mkdir -p pkg/zygisk
          cp -r module/. pkg/
          cp out/arm64-v8a/libunity_fps.so pkg/zygisk/arm64-v8a.so
          cp out/armeabi-v7a/libunity_fps.so pkg/zygisk/armeabi-v7a.so
          cd pkg && zip -r9q ../unity_fps_unlock.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: unity_fps_unlock
          path: build_src/unity_fps_unlock.zip
